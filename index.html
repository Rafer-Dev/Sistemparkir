<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Parkir</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚗 Sistem Parkir</h1>
        <p>Manajemen kendaraan masuk dan keluar</p>
    </header>

    <main>

        <section class="form-box">
            <h2>Parkir Masuk</h2>

            <label>Nomor Kendaraan</label>
            <input type="text" id="plat" placeholder="Contoh: BK 1234 AB">

            <label>Jenis Kendaraan</label>
            <select id="jenis">
                <option value="Motor">Motor</option>
                <option value="Mobil">Mobil</option>
            </select>

            <button onclick="parkirMasuk()">Parkir Masuk</button>
        </section>

        <section class="status">
            <div>
                <h3>Total Kendaraan</h3>
                <p id="total">0</p>
            </div>

            <div>
                <h3>Motor</h3>
                <p id="motor">0</p>
            </div>

            <div>
                <h3>Mobil</h3>
                <p id="mobil">0</p>
            </div>
        </section>

        <section class="table-box">
            <h2>Daftar Kendaraan</h2>

            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Plat Nomor</th>
                        <th>Jenis</th>
                        <th>Jam Masuk</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="daftarParkir">
                </tbody>
            </table>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
